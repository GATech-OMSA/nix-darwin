# .sops.yaml - SOPS Configuration
#
# This file configures SOPS encryption for secrets management
# Generated by configure.sh

keys:
  - &personal_key age1pg50dhdly2t9rrp9nkqukh2cpwv406levh2ttzpajs89rn8umdsqew8ent
  - &work_key age1kgx3snxx34nfhky3wevlk5rlfa88p8gvxdjrhuffttyf6r3463tskknuwk

creation_rules:
  # Personal profile machines (machineId must end with -personal)
  - path_regex: nix-config/hosts/.*-personal/secrets\.yaml$
    key_groups:
      - age:
          - *personal_key
  # Work profile machines (machineId must end with -work)
  - path_regex: nix-config/hosts/.*-work/secrets\.yaml$
    key_groups:
      - age:
          - *work_key
