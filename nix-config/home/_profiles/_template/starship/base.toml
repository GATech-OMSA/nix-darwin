"$schema" = 'https://starship.rs/config-schema.json'

# Starship base config — shared by all full profiles (personal, work).
# Profile-specific additions (e.g. work's k8s/language modules) live in
# <profile>/starship-extras.toml and are shallow-merged (//) over this by
# _template/profile-base.nix.

scan_timeout = 100

format = """
[╭─](fg:surface2) \
$container\
$nix_shell\
$directory\
$git_branch\
$git_status\
$git_state\
$aws\
$python\
$fill\
$cmd_duration\
$time\
$line_break\
[╰─](fg:surface2) \
$character"""

palette = 'catppuccin_mocha'

[directory]
style = "bold fg:blue"
format = "[󰉖 $path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = "󰉍 "
"Music" = "󰝚 "
"Pictures" = "󰉏 "
"Developer" = "󰲋 "

[git_branch]
symbol = "󰊤"
style = "fg:green"
format = "on [$symbol $branch]($style) "

[git_status]
style = "fg:dirty"
format = '([$all_status$ahead_behind]($style) )'
stashed = '≡${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
conflicted = '[=${count}](fg:red)'
deleted = '✘${count}'
renamed = '»${count}'
modified = '!${count}'
staged = '+${count}'
untracked = '?${count}'

[git_state]
format = '[\($state( $progress_current/$progress_total)\)](fg:dirty) '

[nix_shell]
symbol = "󰜗"
style = "fg:sky"
format = '[$symbol $state( \($name\))]($style) '

[aws]
symbol = "󰸏"
style = "fg:peach"
format = '[$symbol $profile( \($region\))]($style) '
disabled = false

[python]
symbol = "󰌠"
style = "fg:teal"
format = '[$symbol $version( \($virtualenv\))]($style) '

[fill]
symbol = " "

[cmd_duration]
format = "[$duration]($style) "
style = "fg:yellow"
min_time = 2000
show_milliseconds = false

[time]
disabled = false
time_format = "%R"
style = "fg:overlay1"
format = "[$time]($style)"

[container]
symbol = "⬢"
style = "bold red dimmed"
format = '[$symbol $name]($style) '

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:lavender)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

