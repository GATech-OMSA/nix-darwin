"$schema" = 'https://starship.rs/config-schema.json'

# LEFT PROMPT - Main powerline
format = """
$container\
[](red)\
$os\
$username\
$hostname\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
$git_state\
$git_metrics\
[](fg:yellow bg:blue)\
$aws\
[](fg:blue bg:sky)\
$kubernetes\
[](fg:sky bg:green)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$terraform\
$direnv\
[](fg:green bg:sapphire)\
$conda\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

# # RIGHT PROMPT - System monitoring (powerline style)
# right_format = """
# [](red)\
# [ $memory_usage$jobs ](bg:yellow fg:crust)\
# [](fg:yellow bg:green)\
# [ $battery ](bg:green fg:crust)\
# [](fg:green bg:blue)\
# [ $cmd_duration ](bg:blue fg:crust)\
# [](fg:blue bg:lavender)\
# [ $time ](bg:lavender fg:crust)\
# [ ](fg:lavender)"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[hostname]
ssh_only = true
style = "bg:red fg:crust"
format = '[@$hostname]($style)'
trim_at = "."

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 🔒"
read_only_style = "bg:peach fg:red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = "󰊤 "
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'
stashed = '≡${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
conflicted = '=${count}'
deleted = '✘${count}'
renamed = '»${count}'
modified = '!${count}'
staged = '+${count}'
untracked = '?${count}'

[git_state]
format = '[[\($state( $progress_current/$progress_total)\)](fg:crust bg:yellow)]($style)'
style = "bg:yellow"

[git_metrics]
disabled = true
format = '([[+$added]($added_style)[-$deleted]($deleted_style)](fg:crust bg:yellow) )'
added_style = 'fg:black bg:yellow'
deleted_style = 'fg:black bg:yellow'
only_nonzero_diffs = true

[aws]
symbol = "  "
style = "bg:blue fg:crust"
format = '[[$symbol$profile@$region ](fg:crust bg:blue)]($style)'
disabled = false

# Region aliases - Shorten AWS region codes
[aws.region_aliases]
us-east-1 = "use1"
us-east-2 = "use2"
us-west-1 = "usw1"
us-west-2 = "usw2"
eu-west-1 = "euw1"
eu-west-2 = "euw2"
eu-central-1 = "euc1"
ap-southeast-1 = "apse1"
ap-southeast-2 = "apse2"
ap-northeast-1 = "apne1"
ap-south-1 = "aps1"

# Profile aliases - Transform verbose profile names to compact format
# Note: These will be dynamically generated from accounts.json in future
# For now, add manually as needed for your accounts
# Example: tririga-integrations-dev = "ti:dev"
[aws.profile_aliases]

[kubernetes]
format = '[[ ☸ $context($namespace) ](fg:crust bg:sky)]($style)'
style = "bg:sky"
disabled = false
detect_files = ['k8s', 'kubernetes', 'Dockerfile', 'docker-compose.yml']

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[php]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[kotlin]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[haskell]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[terraform]
symbol = "󱁢 "
style = "bg:green"
format = '[[ $symbol$workspace ](fg:crust bg:green)]($style)'

[direnv]
format = '[[ direnv ](fg:crust bg:green)]($style)'
style = "bg:green"
disabled = false

[docker_context]
symbol = " "
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

[conda]
symbol = "󰺕 "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[container]
symbol = "⬢ "
style = "bold red dimmed"
format = '[$symbol\[$name\]]($style) '

[memory_usage]
disabled = false
threshold = 75
symbol = "󰍛 "
style = "bold yellow"
format = '[$symbol$ram_pct]($style) '

[jobs]
symbol = "✦"
style = "bold yellow"
format = '[$symbol$number]($style) '
number_threshold = 1

[battery]
format = '[$symbol$percentage]($style) '
disabled = false

[[battery.display]]
threshold = 20
style = "bold red"
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "

[[battery.display]]
threshold = 50
style = "bold yellow"

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:lavender)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bold dimmed white"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[status]
style = "bold red"
format = '[\[$int$common_meaning\]]($style) '
disabled = false

