"$schema" = 'https://starship.rs/config-schema.json'

# Increase scan timeout for large directories (default 30ms is too short)
scan_timeout = 100

# LEFT PROMPT - Main powerline
format = """
$container\
[](red)\
$os\
$username\
$hostname\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
$git_state\
$git_metrics\
[](fg:yellow)\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[hostname]
ssh_only = true
style = "bg:red fg:crust"
format = '[@$hostname]($style)'
trim_at = "."

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 🔒"
read_only_style = "bg:peach fg:red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = "󰊤 "
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'
stashed = '≡${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
conflicted = '=${count}'
deleted = '✘${count}'
renamed = '»${count}'
modified = '!${count}'
staged = '+${count}'
untracked = '?${count}'

[git_state]
format = '[[\($state( $progress_current/$progress_total)\)](fg:crust bg:yellow)]($style)'
style = "bg:yellow"

[git_metrics]
disabled = false
format = '([[+$added]($added_style)[-$deleted]($deleted_style) ](fg:crust bg:yellow))'
added_style = 'fg:black bg:yellow'
deleted_style = 'fg:black bg:yellow'
only_nonzero_diffs = true

[container]
symbol = "⬢ "
style = "bold red dimmed"
format = '[$symbol\[$name\]]($style) '

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:lavender)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

