# Work Mac Encrypted Secrets
# ==========================
# IMPORTANT: This is a TEMPLATE with placeholders
#
# To encrypt this file:
#   1. Replace all [PLACEHOLDER] values with actual secrets
#   2. Run: edit-secrets (on work Mac)
#   3. Or manually: SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt sops -e -i hosts/mbp-work/secrets.yaml
#
# After encrypting, this file will be binary and safe to commit to git

# ============================================
# SSH Keys
# ============================================
work_ssh_private_key: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  [PLACEHOLDER - Add actual work SSH private key]
  Replace this entire section with your actual key from ssh-keygen
  -----END OPENSSH PRIVATE KEY-----

work_ssh_public_key: ssh-ed25519 AAAA[PLACEHOLDER] work@company.com

