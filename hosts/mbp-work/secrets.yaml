# ============================================
# Instructions for Adding Real Secrets
# ============================================
# 1. Generate work SSH keys:
#    ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519_work -C "work@company.com"
#
# 2. Copy the keys:
#    - Private key: cat ~/.ssh/id_ed25519_work
#    - Public key: cat ~/.ssh/id_ed25519_work.pub
#
# 3. Get database credentials from:
#    - Company password manager (1Password, LastPass, etc.)
#    - IT department
#    - Existing connection files
#
# 4. Generate API tokens:
#    - GitHub: Settings → Developer settings → Personal access tokens
#    - GitLab: Preferences → Access Tokens
#    - HCP Terraform: Organization settings → API tokens
#    - Jira: Profile → Personal Access Tokens
#
# 5. After adding real values, encrypt:
#    edit-secrets
#    (or manually: SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt sops -e -i hosts/mbp-work/secrets.yaml)
#
# 6. Verify encryption worked:
#    file hosts/mbp-work/secrets.yaml
#    (Should show binary/encrypted, not ASCII text)
#
# 7. Rebuild system:
#    darwin-rebuild switch --flake .#mbp-work
#
# 8. Verify secret restoration:
#    ls -la ~/.ssh/id_ed25519_work
#    ls -la ~/.db/
#    ls -la ~/.tokens/
