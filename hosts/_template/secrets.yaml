# Template secrets file
# This file should be encrypted with SOPS before use
#
# Setup instructions:
#   1. Generate age key: age-keygen -o ~/.config/sops/age/keys.txt
#   2. Get public key: grep "public key:" ~/.config/sops/age/keys.txt
#   3. Update secrets/.sops.yaml with your public key
#   4. Edit this file: sops hosts/HOSTNAME/secrets.yaml
#   5. Add your actual secrets (examples below)
#
# Common secret patterns:

# Environment variables and API keys
zsh_secrets: |
  export OPENAI_API_KEY="sk-..."
  export GITHUB_TOKEN="ghp_..."
  export ANTHROPIC_API_KEY="sk-ant-..."

# SSH private key (ed25519 recommended)
ssh_private_key: |
  -----BEGIN OPENSSH PRIVATE KEY-----
  REPLACE_WITH_YOUR_PRIVATE_KEY
  -----END OPENSSH PRIVATE KEY-----

# SSH public key
ssh_public_key: "ssh-ed25519 AAAAC3... user@hostname"

# AWS credentials (if using AWS)
# aws_credentials: |
#   [default]
#   aws_access_key_id = AKIA...
#   aws_secret_access_key = ...
#
#   [personal]
#   aws_access_key_id = AKIA...
#   aws_secret_access_key = ...

# Add more secrets as needed
