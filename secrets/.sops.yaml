# Sops Configuration for nix-darwin
# This file controls which age keys can decrypt which secrets

# Age public keys for each machine
# IMPORTANT: Replace YOUR_PUBLIC_AGE_KEY_HERE with your actual public age key
# Get it by running: grep "public key:" ~/.config/sops/age/keys.txt

keys:
  # Personal Mac (mbp-jimmy)
  - &jimmy_personal age1pg50dhdly2t9rrp9nkqukh2cpwv406levh2ttzpajs89rn8umdsqew8ent

  # Work Mac (mbp-work) - generate separate key on work machine
  - &jimmy_work age1kgx3snxx34nfhky3wevlk5rlfa88p8gvxdjrhuffttyf6r3463tskknuwk

# Encryption rules - which keys can decrypt which files
creation_rules:
  # Personal Mac secrets
  - path_regex: hosts/mbp-jimmy/secrets\.yaml$
    key_groups:
      - age:
          - *jimmy_personal

  # Work Mac secrets
  - path_regex: hosts/mbp-work/secrets\.yaml$
    key_groups:
      - age:
          - *jimmy_work

  # Shared secrets (if any) - both machines can decrypt
  - path_regex: secrets/shared\.yaml$
    key_groups:
      - age:
          - *jimmy_personal
          - *jimmy_work
