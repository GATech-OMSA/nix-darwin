name: CI

on:
  push:
    branches: [ main ]
    paths:
      - '*.nix'
      - 'flake.lock'
      - 'nix-config/**'
      - 'config/*.template'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '*.nix'
      - 'flake.lock'
      - 'nix-config/**'
      - 'config/*.template'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@v3
      
    - name: Magic Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@main
      
    - name: Generate Configs
      run: |
        # Generate dummy configs for CI
        cp config/machine-config.nix.template config/machine-config.nix
        cp config/user-config.nix.template config/user-config.nix

        # Set a valid machineId for the dry-run (portable sed - works on BSD and GNU)
        # Use [^"]* instead of .* to avoid greedy matching past the first closing quote
        sed 's/machineId = "[^"]*"/machineId = "macbook-pro-m1"/' config/machine-config.nix > config/machine-config.nix.tmp && mv config/machine-config.nix.tmp config/machine-config.nix
        sed 's/profileName = "[^"]*"/profileName = "personal"/' config/machine-config.nix > config/machine-config.nix.tmp && mv config/machine-config.nix.tmp config/machine-config.nix
      
    - name: Check Flake
      run: nix flake check

    # Note: tests/run-all-tests.sh is for local development validation
    # It requires darwin-rebuild, SOPS, and specific hostnames that don't exist on CI
    # CI validation is covered by 'nix flake check' and the dry-run build below

    - name: Build System (Dry Run)
      # Builds the system derivation without realizing it (dry-run logic)
      # Uses the machineId defined in config/machine-config.nix
      run: |
        MACHINE_ID=$(grep 'machineId =' config/machine-config.nix | cut -d'"' -f2)
        echo "Building for machine: $MACHINE_ID"
        nix build ".#darwinConfigurations.$MACHINE_ID.system" --dry-run
