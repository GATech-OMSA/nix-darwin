name: CI

on:
  push:
    branches: [ main ]
    paths:
      - '*.nix'
      - 'flake.lock'
      - 'nix-config/**'
      - 'config/*.template'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '*.nix'
      - 'flake.lock'
      - 'nix-config/**'
      - 'config/*.template'
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        machine: [macbook-pro-m1-personal, macbook-pro-m3-work]
    steps:
    - uses: actions/checkout@v4

    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@v3

    - name: Magic Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@main

    - name: Generate Configs
      env:
        MACHINE_ID: ${{ matrix.machine }}
      run: |
        # Generate stub configs for CI (flake needs these to evaluate)
        cp config/machine-config.nix.template config/machine-config.nix
        cp config/user-config.nix.template config/user-config.nix

        # Set valid values in stubs (machine registry in flake.nix has the real configs)
        sed "s/machineId = \"[^\"]*\"/machineId = \"${MACHINE_ID}\"/" config/machine-config.nix > config/machine-config.nix.tmp && mv config/machine-config.nix.tmp config/machine-config.nix
        sed 's/profileName = "[^"]*"/profileName = "personal"/' config/machine-config.nix > config/machine-config.nix.tmp && mv config/machine-config.nix.tmp config/machine-config.nix
        sed 's/REPLACE_USERNAME/ci-user/' config/user-config.nix > config/user-config.nix.tmp && mv config/user-config.nix.tmp config/user-config.nix
        sed 's/REPLACE_FULLNAME/CI User/' config/user-config.nix > config/user-config.nix.tmp && mv config/user-config.nix.tmp config/user-config.nix
        sed 's/REPLACE_EMAIL/ci@example.com/' config/user-config.nix > config/user-config.nix.tmp && mv config/user-config.nix.tmp config/user-config.nix
        sed 's/REPLACE_AWS_SSO_ENABLED/false/' config/user-config.nix > config/user-config.nix.tmp && mv config/user-config.nix.tmp config/user-config.nix
        sed 's/REPLACE_AWS_SSO_URL//' config/user-config.nix > config/user-config.nix.tmp && mv config/user-config.nix.tmp config/user-config.nix
        sed 's/REPLACE_AWS_SSO_REGION/us-east-1/' config/user-config.nix > config/user-config.nix.tmp && mv config/user-config.nix.tmp config/user-config.nix

    - name: Check Flake
      run: nix flake check

    - name: Build System (Dry Run)
      env:
        MACHINE_ID: ${{ matrix.machine }}
      run: |
        echo "Building: ${MACHINE_ID}"
        nix build ".#darwinConfigurations.${MACHINE_ID}.system" --dry-run
