# machines/mac-14/config/atuin/config.toml
#
# Identical to the live ~/.config/atuin/config.toml on the personal Nix machine
# (generated there from nix-config/.../programs/atuin.nix). Local-only history:
# auto_sync = false.

auto_sync = false
enter_accept = true
filter_mode = "global"
history_filter = ['^\s+', "^exit$", "^clear$"]
inline_height = 0
max_preview_height = 4
search_mode = "fuzzy"
secrets_filter = true
show_preview = true
store_failed = true
style = "compact"
sync_frequency = "1h"
