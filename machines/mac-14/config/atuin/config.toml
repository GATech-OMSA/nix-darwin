# machines/mac-14/config/atuin/config.toml
#
# Same settings as nix-config/home/_profiles/_template/programs/atuin.nix.
# Local-only history: no sync (work machine).

search_mode = "fuzzy"
filter_mode = "global"
style = "compact"
show_preview = true
max_preview_height = 4
inline_height = 0
history_filter = [
  "^\\s+",   # Ignore commands starting with space
  "^exit$",
  "^clear$",
]
auto_sync = false
enter_accept = true
secrets_filter = true   # Auto-filter AWS keys, tokens, passwords from history
store_failed = true
