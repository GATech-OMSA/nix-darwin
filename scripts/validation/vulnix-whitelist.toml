# vulnix-whitelist.toml — accepted / triaged CVEs for scan-vulnerabilities.sh
#
# Entries here are filtered OUT of the CVE scan so the report stays actionable
# (a full closure scan flags ~20+ packages, most unexploitable in this context).
# Whitelist a CVE only after triage: confirm it's a false version-match, not
# reachable in how the package is used, or already patched in nixpkgs despite
# the NVD version string.
#
# Format (one table per affected derivation; key is the exact pname-version):
#
#   ["openssl-3.6.2"]
#   cve = [ "CVE-2026-7383", "CVE-2026-9076" ]
#   comment = "false match: linked statically, vuln path not compiled in"
#
# A single CVE may be a bare string instead of a list:
#
#   ["libxml2-2.15.2"]
#   cve = "CVE-2026-6732"
#   comment = "DoS only, not network-exposed on this host"
#
# Regenerate a full snapshot of *current* matches (then prune to what you
# actually accept) with:
#   vulnix -C /run/current-system -W /tmp/wl.toml
#
# Keep this list short and dated in comments. An over-broad whitelist silently
# re-hides the exact regressions this scan exists to catch.

# ── Triaged 2026-06-28 (lock 89570f2, nixpkgs ~5 days old) ─────────────────
# Accepted below: essential/ubiquitous libs (get fixed via `update-nix` when
# nixpkgs bumps the version — the version-pinned key auto-invalidates the entry
# on a bump, forcing re-triage) and direct CLI tools whose CVEs require a crafted
# local file to trigger.
#
# Deliberately NOT whitelisted (still flagged by secnow) — removal candidates,
# pending a keep-vs-remove decision: imagemagick, libraw, openexr, libheif,
# libde265 (imaging stack ← fastfetch + yazi), unbound (← yazi + yt-dlp), and
# ada (← repomix + markdown-link-check). Co-owned, so removal needs ALL owners.

# Essential transport/crypto/base libs — pulled by openssh/curl, not removable.
["openssl-3.6.2"]
cve = [ "CVE-2026-34180", "CVE-2026-34181", "CVE-2026-34182", "CVE-2026-34183", "CVE-2026-35188", "CVE-2026-42764", "CVE-2026-42765", "CVE-2026-42766", "CVE-2026-42767", "CVE-2026-42768", "CVE-2026-42769", "CVE-2026-42770", "CVE-2026-45445", "CVE-2026-45446", "CVE-2026-45447", "CVE-2026-7383", "CVE-2026-9076" ]

